[pytest]
testpaths = .
# Warnings raised by `spreg`/`scipy` themselves, not by this project. Silenced so that
# a real warning of our own is not lost in the noise.
filterwarnings =
    ignore:Method 'bounded' does not support relative tolerance:RuntimeWarning
    ignore:Please import `csr_matrix`:DeprecationWarning
    ignore:Please import `csc_matrix`:DeprecationWarning
