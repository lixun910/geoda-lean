name: Validation

# Numerical cross-checks of the formulas in `GeoDa/` against NumPy, SciPy and PySAL
# `spreg`, plus a CI-scale Monte Carlo smoke run of the `spreg` estimators. Kept in its
# own workflow, and its own job, so that it stays lightweight and so that it is never
# confused with the verification.
#
# This job is a *second opinion* on the formulas, not the proof. The verification is
# `./scripts/verify.sh`, run by the `Lean` workflow: that is what establishes the
# theorem statements, the absence of `sorry`, and the axiom footprint. Here we only
# check that a concrete instance of the same formulas agrees with an independent
# implementation.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  numerical:
    name: Numerical cross-checks (NumPy, SciPy, PySAL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to match validation/requirements.txt, which was resolved and run
          # green on CPython 3.14. Do not bump these without re-running the suite.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: validation/requirements.txt

      - name: Install pinned dependencies
        run: pip install -r validation/requirements.txt

      - name: Numerical cross-checks against the Lean formulas
        run: python -m pytest validation -q

      # CI-scale Monte Carlo smoke run. Empirical, and like everything in this
      # workflow it is not verification: it reports bias/RMSE/coverage for `spreg`
      # estimators, which says nothing about any Lean theorem.
      - name: Monte Carlo benchmark (CI-scale smoke run)
        run: python validation/benchmark/benchmark.py --smoke
